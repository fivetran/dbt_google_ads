version: 2

models:
  - name: google_ads__url_report
    description: Each record in this table represents the daily performance of URLs at the ad level.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('external_customer_id') }}"
      - name: currency_code
        description: The currency which the account uses.
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
      - name: ad_group_name
        description: "{{ doc('ad_group_name') }}"
      - name: ad_group_id
        description: "{{ doc('ad_group_id') }}"
      - name: ad_id
        description: The unique identifier of the ad.
      - name: base_url
        description: "{{ doc('base_url') }}"
        tests:
          - not_null:
              config:
                # Below is so we don't run this test if the user has allowed urls to have null entries
                enabled: "{{ var('ad_reporting__url_report__using_null_filter', true) }}"
      - name: url_host
        description: "{{ doc('url_host') }}"
      - name: url_path
        description: "{{ doc('url_path') }}"
      - name: utm_source
        description: "{{ doc('utm_source') }}"
      - name: utm_medium
        description: "{{ doc('utm_medium') }}"
      - name: utm_campaign
        description: "{{ doc('utm_campaign') }}"
      - name: utm_content
        description: "{{ doc('utm_content') }}"
      - name: utm_term
        description: "{{ doc('utm_term') }}"
      - name: spend
        description: "{{ doc('cost') }}"
      - name: clicks
        description: "{{ doc('clicks') }}"
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: conversions
        description: "{{ doc('conversions') }}"
      - name: conversions_value
        description: "{{ doc('conversions_value') }}"
      - name: view_through_conversions
        description: "{{ doc('view_through_conversions') }}"

  - name: google_ads__account_report
    description: Each record in this table represents the daily performance at the account level.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('external_customer_id') }}"
        tests:
          - not_null
      - name: time_zone
        description: The time zone which the account is located.
      - name: currency_code
        description: The currency which the account uses.
      - name: auto_tagging_enabled
        description: Boolean indicating if the account uses auto tagging within ad urls.
      - name: spend
        description: "{{ doc('cost') }}"
      - name: clicks
        description: "{{ doc('clicks') }}"
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: conversions
        description: "{{ doc('conversions') }}"
      - name: conversions_value
        description: "{{ doc('conversions_value') }}"
      - name: view_through_conversions
        description: "{{ doc('view_through_conversions') }}"

  - name: google_ads__ad_group_report
    description: Each record in this table represents the daily performance at the ad group level.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('external_customer_id') }}"
      - name: currency_code
        description: The currency which the account uses.
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
      - name: ad_group_name
        description: "{{ doc('ad_group_name') }}"
      - name: ad_group_id
        description: "{{ doc('ad_group_id') }}"
        tests:
          - not_null
      - name: ad_group_status
        description: The status of the ad group.
      - name: ad_group_type
        description: The type of ad group which is serving ads.
      - name: spend
        description: "{{ doc('cost') }}"
      - name: clicks
        description: "{{ doc('clicks') }}"
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: conversions
        description: "{{ doc('conversions') }}"
      - name: conversions_value
        description: "{{ doc('conversions_value') }}"
      - name: view_through_conversions
        description: "{{ doc('view_through_conversions') }}"

  - name: google_ads__ad_report
    description: Each record in this table represents the daily performance at the ad level.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('external_customer_id') }}"
      - name: currency_code
        description: The currency which the account uses.
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
      - name: ad_group_name
        description: "{{ doc('ad_group_name') }}"
      - name: ad_group_id
        description: "{{ doc('ad_group_id') }}"
      - name: ad_id
        description: The unique identifier of the ad.
        tests:
          - not_null
      - name: display_url
        description: The url which is displayed with the ad.
      - name: source_final_urls
        description: The final urls that are used within the ad.
      - name: ad_status
        description: The status of the ad.
      - name: ad_type
        description: The type of the ad that is being served.
      - name: spend
        description: "{{ doc('cost') }}"
      - name: clicks
        description: "{{ doc('clicks') }}"
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: conversions
        description: "{{ doc('conversions') }}"
      - name: conversions_value
        description: "{{ doc('conversions_value') }}"
      - name: view_through_conversions
        description: "{{ doc('view_through_conversions') }}"

  - name: google_ads__campaign_report
    description: Each record in this table represents the daily performance of a campaign at the campaign/advertising_channel/advertising_channel_subtype level.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('external_customer_id') }}"
      - name: currency_code
        description: The currency which the account uses.
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
        tests:
          - not_null
      - name: advertising_channel_type
        description: The channel type of the ads being served within the campaign.
      - name: advertising_channel_subtype
        description: The channel subtype of the ads being served within the campaign.
      - name: status
        description: The status of the campaign.
      - name: serving_status
        description: Status of the ads and how they are currently being served.
      - name: spend
        description: "{{ doc('cost') }}"
      - name: clicks
        description: "{{ doc('clicks') }}"
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: conversions
        description: "{{ doc('conversions') }}"
      - name: conversions_value
        description: "{{ doc('conversions_value') }}"
      - name: view_through_conversions
        description: "{{ doc('view_through_conversions') }}"
      - name: ctr_percent
        description: Click-through rate as a percentage, calculated as (clicks / impressions) * 100. Shows ad relevance and engagement.

  - name: google_ads__keyword_report
    description: Each record in this table represents the daily performance at the ad group level for keywords.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('external_customer_id') }}"
      - name: currency_code
        description: The currency which the account uses.
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
      - name: ad_group_name
        description: "{{ doc('ad_group_name') }}"
      - name: ad_group_id
        description: "{{ doc('ad_group_id') }}"
      - name: criterion_id
        description: The unique identifier of the criterion being served.
        tests:
          - not_null
      - name: type
        description: The type of keyword ad being served.
      - name: status
        description: The status of the keyword ads.
      - name: keyword_match_type
        description: The match type criteria used for the keyword ads.
      - name: keyword_text
        description: The specific keyword text that is used.
      - name: spend
        description: "{{ doc('cost') }}"
      - name: clicks
        description: "{{ doc('clicks') }}"
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: conversions
        description: "{{ doc('conversions') }}"
      - name: conversions_value
        description: "{{ doc('conversions_value') }}"
      - name: view_through_conversions
        description: "{{ doc('view_through_conversions') }}"

  - name: google_ads__search_term_report
    description: Each record in this table represents the daily performance at the ad group level for search terms matching tracked keywords.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: date_day
        description: "{{ doc('date') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('external_customer_id') }}"
      - name: currency_code
        description: The currency which the account uses.
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
      - name: ad_group_name
        description: "{{ doc('ad_group_name') }}"
      - name: ad_group_id
        description: "{{ doc('ad_group_id') }}"
      - name: search_term
        description: '{{ doc("search_term") }}'
      - name: keyword_text 
        description: '{{ doc("info_text") }}'
      - name: search_term_match_type
        description: '{{ doc("search_term_match_type") }}'
      - name: status
        description: '{{ doc("search_term_status") }}'
      - name: spend
        description: "{{ doc('cost') }}"
      - name: clicks
        description: "{{ doc('clicks') }}"
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: conversions
        description: "{{ doc('conversions') }}"
      - name: conversions_value
        description: "{{ doc('conversions_value') }}"
      - name: view_through_conversions
        description: "{{ doc('view_through_conversions') }}"
      - name: criterion_id
        description: Reference to the ad group criterion used for the associated keyword. One `keyword_text` may have multiple `criterion_id` values.

  - name: google_ads__campaign_bid_modifiers_report
    description: Each record in this table represents a specific bid modifier and its performance insights. Data is at the campaign-criterion grain since bid modifiers are campaign-level settings, and analysis focuses on overall modifier effectiveness.
    columns:
      - name: bid_modifier_report_key
        description: Surrogate key for the campaign bid modifiers report, combining source_relation, account_id, campaign_id, and criterion_id.
        tests:
          - unique
          - not_null
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('account_id') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
        tests:
          - not_null
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: advertising_channel_type
        description: The type of advertising channel being used by the campaign.
      - name: advertising_channel_subtype
        description: The advertising channel subtype that is being used by the campaign.
      - name: campaign_status
        description: General status of the campaign.
      - name: serving_status
        description: Status of the ads and how they are currently being served.
      - name: bidding_strategy_type
        description: The type of bidding strategy (MANUAL_CPC, TARGET_CPA, etc.).
      - name: target_cpa
        description: Target cost per acquisition.
      - name: target_roas
        description: Target return on ad spend.
      - name: enhanced_cpc
        description: Boolean indicating if enhanced CPC is enabled.
      - name: manual_cpa
        description: Manual cost per acquisition setting.
      - name: manual_cpm
        description: Manual cost per mille setting.
      - name: manual_cpv
        description: Manual cost per view setting.
      - name: bidding_status
        description: The status of the bidding strategy.
      - name: criterion_id
        description: Unique identifier of the criterion that the bid modifier is applied to.
      - name: bid_modifier
        description: The modifier applied to the bid for this criterion.
      - name: interaction_type
        description: The type of interaction for the bid modifier.
      - name: interaction_event_types
        description: The event types for the interaction.
      - name: modifier_type
        description: The type of modifier (device, location, age_range, gender, etc.).
      - name: modifier_direction
        description: Direction of the modifier (positive adjustment, negative adjustment, no adjustment, no modifier set).
      - name: modifier_percentage
        description: The bid modifier percentage change.
      - name: total_spend
        description: Total spend in the last 30 days.
      - name: avg_ctr_percent
        description: Average click-through rate percentage.
      - name: avg_cpc
        description: Average cost per click.
      - name: _fivetran_observation
        description: Performance observation that drives the recommendation (High CPC, Low CTR, High spend, etc.).
      - name: _fivetran_recommendation
        description: Inferred action for bid modifier optimization based on dbt package logic (Add modifiers, Review adjustments, Monitor performance, Monitor).
      - name: _fivetran_priority
        description: Inferred priority level for focusing on most critical issues first (high, medium, low).

  - name: google_ads__campaign_budget_diagnostics_report
    description: Each record in this table represents a campaign's budget constraints and performance diagnostics.
    columns:
      - name: budget_diagnostics_report_key
        description: Surrogate key for the campaign budget diagnostics report, combining source_relation, account_id, campaign_id, and date_day.
        tests:
          - unique
          - not_null
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: campaign_id
        description: "{{ doc('campaign_id') }}"
        tests:
          - not_null
      - name: date_day
        description: "{{ doc('date') }}"
      - name: campaign_name
        description: "{{ doc('campaign_name') }}"
      - name: account_name
        description: "{{ doc('account_descriptive_name') }}"
      - name: account_id
        description: "{{ doc('account_id') }}"
      - name: advertising_channel_type
        description: The type of advertising channel being used by the campaign.
      - name: advertising_channel_subtype
        description: The advertising channel subtype that is being used by the campaign.
      - name: campaign_status
        description: General status of the campaign.
      - name: serving_status
        description: Status of the ads and how they are currently being served.
      - name: daily_budget
        description: The daily budget amount for the campaign.
      - name: total_budget
        description: The total budget amount for lifetime campaigns.
      - name: budget_type
        description: The type of budget (DAILY, LIFETIME, etc.).
      - name: budget_status
        description: The status of the budget.
      - name: has_recommended_budget
        description: Boolean indicating if Google has a recommended budget for this campaign.
      - name: recommended_daily_budget
        description: Google's recommended daily budget when available, otherwise falls back to current daily budget for consistency.
      - name: budget_increase_opportunity
        description: Dollar amount by which Google recommends increasing the daily budget (0 when Google has no recommendation).
      - name: bidding_strategy_type
        description: The type of bidding strategy (MANUAL_CPC, TARGET_CPA, etc.).
      - name: target_cpa
        description: Target cost per acquisition.
      - name: target_roas
        description: Target return on ad spend.
      - name: enhanced_cpc
        description: Boolean indicating if enhanced CPC is enabled.
      - name: impressions
        description: "{{ doc('impressions') }}"
      - name: spend
        description: "{{ doc('cost') }}"
      - name: ctr_percent
        description: Click-through rate percentage.
      - name: budget_utilization_percent
        description: Percentage of daily budget utilized.
      - name: total_targeting_criteria
        description: Total number of targeting criteria set for the campaign.
      - name: location_targeting_count
        description: Number of location targeting criteria.
      - name: audience_targeting_count
        description: Number of audience targeting criteria.
      - name: location_targeting_breadth
        description: Assessment of location targeting breadth - 'limited' (< 5 locations), 'broad' (> 50 locations), or 'normal'.
      - name: device_targeting_assessment
        description: Assessment of device targeting constraints.
      - name: audience_targeting_assessment
        description: Assessment of audience targeting constraints.
      - name: avg_top_impression_share
        description: Average top impression share percentage.
      - name: avg_absolute_top_impression_share
        description: Average absolute top impression share percentage.
      - name: constraint_status
        description: The type of constraint affecting campaign performance.
      - name: constraint_severity
        description: The severity level of the constraint (high, medium, low, minimal).
      - name: recommendation
        description: Automated recommendation for improving performance.
      - name: daily_budget_efficiency_percent
        description: Daily budget efficiency percentage.
      - name: monthly_budget_opportunity
        description: Potential monthly budget increase opportunity.
      - name: _fivetran_observation
        description: Performance observation that drives the budget recommendation (budget constrained, placement constrained, etc.).
      - name: _fivetran_recommendation
        description: Inferred action for budget optimization based on dbt package logic (increase budget, optimize targeting/bids, improve relevance, etc.).
      - name: _fivetran_priority
        description: Inferred priority level for focusing on most critical budget issues first (high, medium, low).
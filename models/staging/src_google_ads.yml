version: 2

sources:
  - name: google_ads # This source will only be used if you are using a single google_ads source connector. If multiple sources are being unioned, their tables will be directly referenced via adapter.get_relation.
    schema: "{{ var('google_ads_schema', 'google_ads') }}"
    database: "{% if target.type != 'spark' %}{{ var('google_ads_database', target.database) }}{% endif %}"

    loader: Fivetran

    config:
      loaded_at_field: _fivetran_synced
      enabled: "{{ var('ad_reporting__google_ads_enabled', true) and var('google_ads_sources', []) == [] }}"
      freshness: 
        warn_after: {count: 48, period: hour}
        error_after: {count: 168, period: hour}
      
    tables:
      - name: ad_stats
        description: Each record represents the daily performance of an ad in Google Ads broken down to the ad network, device type, and ad group criterion.
        identifier: "{{ var('google_ads_ad_stats_identifier', 'ad_stats') }}"
        columns:
          - name: customer_id
            description: "{{ doc('external_customer_id') }}"
          - name: date
            description: "{{ doc('date') }}"
          - name: ad_group
            description: "{{ doc('ad_group_id') }}"
          - name: ad_id
            description: "{{ doc('ad_id') }}"
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: ad_network_type
            description: "{{ doc('ad_network_type') }}"
          - name: device
            description: "{{ doc('device') }}"
          - name: keyword_ad_group_criterion
            description: The ad group which the keyword criterion resides.
          - name: clicks
            description: "{{ doc('clicks') }}"
          - name: cost_micros
            description: "{{ doc('cost') }}"
          - name: impressions
            description: "{{ doc('impressions') }}"
          - name: conversions
            description: "{{ doc('conversions') }}"
          - name: conversions_value
            description: "{{ doc('conversions_value') }}"
          - name: view_through_conversions
            description: "{{ doc('view_through_conversions') }}"

      - name: ad_history
        description: Each record represents a version of an ad in Google Ads.
        identifier: "{{ var('google_ads_ad_history_identifier', 'ad_history') }}"
        columns:
          - name: ad_group_id
            description: "{{ doc('ad_group_id') }}"
          - name: id
            description: "{{ doc('ad_id') }}"
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: display_url
            description: The display url of the ad that is being served.
          - name: type
            description: "{{ doc('ad_type') }}"
          - name: status
            description: "{{ doc('ad_status') }}"
          - name: final_urls
            description: A list of urls that are used for the ad.
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: ad_group_history
        description: Each record represents a version of an ad group in Google Ads.
        identifier: "{{ var('google_ads_ad_group_history_identifier', 'ad_group_history') }}"
        columns:
          - name: id
            description: "{{ doc('ad_group_id') }}"
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: type
            description: "{{ doc('ad_group_type') }}"
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: campaign_name
            description: "{{ doc('campaign_name') }}"
          - name: name
            description: "{{ doc('ad_group_name') }}"
          - name: status
            description: "{{ doc('ad_group_status') }}"
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: campaign_history
        description: Each record represents a version of a campaign in Google Ads.
        identifier: "{{ var('google_ads_campaign_history_identifier', 'campaign_history') }}"
        columns:
          - name: id
            description: "{{ doc('campaign_id') }}"
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: ad_network_type
            description: "{{ doc('ad_network_type') }}"
          - name: advertising_channel_type
            description: The type of advertising channel being used by the campaign.
          - name: advertising_channel_subtype
            description: The advertising channel subtype that is being used by the campaign.
          - name: start_date
            description: The start date of the campaign.
          - name: start_date_time
            description: The start date and time of the campaign as a timestamp.
          - name: end_date
            description: The end date of the campaign.
          - name: end_date_time
            description: The end date and time of the campaign as a timestamp.
          - name: serving_status
            description: Status of the ads and how they are currently being served.
          - name: status
            description: General status of the campaign.
          - name: tracking_url_template
            description: The tracking url template being used throughout the campaign ads.
          - name: device
            description: "{{ doc('device') }}"
          - name: name
            description: "{{ doc('campaign_name') }}"
          - name: customer_id
            description: "{{ doc('external_customer_id') }}"
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: account_history
        description: Each record represents a historical version of an account in Google Ads.
        identifier: "{{ var('google_ads_account_history_identifier', 'account_history') }}"
        columns:
          - name: id
            description: "{{ doc('account_id') }}"
          - name: currency_code
            description: The currency of the spend reported.
          - name: auto_tagging_enabled
            description: Boolean indicating if auto tagging is enabled on the account ads.
          - name: time_zone
            description: The time zone of the account ads.
          - name: descriptive_name
            description: "{{ doc('account_descriptive_name') }}"
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: ad_group_criterion_history
        description: Each record represents a historical version of an ad group criterion in Google Ads.
        identifier: "{{ var('google_ads_ad_group_criterion_history_identifier', 'ad_group_criterion_history') }}"
        columns:
          - name: id
            description: Unique identifier of the ad group criterion.
          - name: ad_group_id
            description: "{{ doc('ad_group_id') }}"
          - name: base_campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: type
            description: The type of ad group criterion.
          - name: status
            description: The current status of the ad group criterion.
          - name: keyword_match_type
            description: The match type which dictate how closely the keyword needs to match with the user's search query so that the ad can be considered for the auction. 
          - name: keyword_text
            description: The text used within the keyword criterion that is being matched against.
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: ad_group_stats
        description: Each record represents the daily performance of an ad group in Google Ads broken down to the ad network and device type.
        identifier: "{{ var('google_ads_ad_group_stats_identifier', 'ad_group_stats') }}"
        columns:
          - name: customer_id
            description: "{{ doc('external_customer_id') }}"
          - name: date
            description: "{{ doc('date') }}"
          - name: id
            description: "{{ doc('ad_group_id') }}"
          - name: ad_network_type
            description: "{{ doc('ad_network_type') }}"
          - name: device
            description: "{{ doc('device') }}"
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: clicks
            description: "{{ doc('clicks') }}"
          - name: cost_micros
            description: "{{ doc('cost') }}"
          - name: impressions
            description: "{{ doc('impressions') }}"
          - name: conversions
            description: "{{ doc('conversions') }}"
          - name: conversions_value
            description: "{{ doc('conversions_value') }}"
          - name: view_through_conversions
            description: "{{ doc('view_through_conversions') }}"

      - name: campaign_stats
        description: Each record represents the daily performance of a campaign in Google Ads broken down to the ad network and device type.
        identifier: "{{ var('google_ads_campaign_stats_identifier', 'campaign_stats') }}"
        columns:
          - name: customer_id
            description: "{{ doc('external_customer_id') }}"
          - name: date
            description: "{{ doc('date') }}"
          - name: id
            description: "{{ doc('campaign_id') }}"
          - name: clicks
            description: "{{ doc('clicks') }}"
          - name: cost_micros
            description: "{{ doc('cost') }}"
          - name: impressions
            description: "{{ doc('impressions') }}"
          - name: conversions
            description: "{{ doc('conversions') }}"
          - name: conversions_value
            description: "{{ doc('conversions_value') }}"
          - name: view_through_conversions
            description: "{{ doc('view_through_conversions') }}"

      - name: keyword_stats
        description: Each record represents the daily performance of a keyword in Google Ads.
        identifier: "{{ var('google_ads_keyword_stats_identifier', 'keyword_stats') }}"
        columns:
          - name: customer_id
            description: "{{ doc('external_customer_id') }}"
          - name: date
            description: "{{ doc('date') }}"
          - name: ad_group_id
            description: "{{ doc('ad_group_id') }}"
          - name: _fivetran_id
            description: The unique ID of the keyword record.
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: ad_group_criterion_criterion_id
            description: Reference to the ad group criterion used for the keyword.
          - name: clicks
            description: "{{ doc('clicks') }}"
          - name: cost_micros
            description: "{{ doc('cost') }}"
          - name: impressions
            description: "{{ doc('impressions') }}"
          - name: conversions
            description: "{{ doc('conversions') }}"
          - name: conversions_value
            description: "{{ doc('conversions_value') }}"
          - name: view_through_conversions
            description: "{{ doc('view_through_conversions') }}"

      - name: account_stats
        description: Each record represents the daily performance of an account in Google Ads broken down to the ad network and device type.
        identifier: "{{ var('google_ads_account_stats_identifier', 'account_stats') }}"
        columns:
          - name: customer_id
            description: "{{ doc('external_customer_id') }}"
          - name: date
            description: "{{ doc('date') }}"
          - name: ad_network_type
            description: "{{ doc('ad_network_type') }}"
          - name: device
            description: "{{ doc('device') }}"
          - name: clicks
            description: "{{ doc('clicks') }}"
          - name: cost_micros
            description: "{{ doc('cost') }}"
          - name: impressions
            description: "{{ doc('impressions') }}"
          - name: conversions
            description: "{{ doc('conversions') }}"
          - name: conversions_value
            description: "{{ doc('conversions_value') }}"
          - name: view_through_conversions
            description: "{{ doc('view_through_conversions') }}"

      - name: search_term_keyword_stats
        identifier: '{{ var("google_ads_search_term_keyword_stats_identifier", "search_term_keyword_stats") }}'
        description: Each record represents the daily performance of a search term (including associated tracked keywords) in Google Ads.
        config:
          enabled: "{{ var('ad_reporting__google_ads_enabled', true) and var('google_ads__using_search_term_keyword_stats', true) and var('google_ads_sources', []) == [] }}"
        columns:
          - name: customer_id
            description: '{{ doc("external_customer_id") }}'
          - name: date
            description: '{{ doc("date") }}'
          - name: _fivetran_id
            description: '{{ doc("_fivetran_id") }}'
          - name: resource_name
            description: '{{ doc("resource_name") }}'
          - name: search_term
            description: '{{ doc("search_term") }}'
          - name: conversions_value
            description: '{{ doc("conversions_value") }}'
          - name: conversions
            description: '{{ doc("conversions") }}'
          - name: campaign_id
            description: '{{ doc("campaign_id") }}'
          - name: search_term_match_type
            description: '{{ doc("search_term_match_type") }}'
          - name: impressions
            description: '{{ doc("impressions") }}'
          - name: ad_group_id
            description: '{{ doc("ad_group_id") }}'
          - name: view_through_conversions
            description: '{{ doc("view_through_conversions") }}'
          - name: clicks
            description: '{{ doc("clicks") }}'
          - name: keyword_ad_group_criterion
            description: '{{ doc("keyword_ad_group_criterion") }}'
          - name: status
            description: '{{ doc("search_term_status") }}'
          - name: info_text
            description: '{{ doc("info_text") }}'
          - name: conversions_from_interactions_value_per_interaction
            description: '{{ doc("conversions_from_interactions_value_per_interaction") }}'
          - name: average_cpc
            description: '{{ doc("average_cpc") }}'
          - name: ctr
            description: '{{ doc("ctr") }}'
          - name: conversions_from_interactions_rate
            description: '{{ doc("conversions_from_interactions_rate") }}'
          - name: cost_micros
            description: '{{ doc("cost") }}'
          - name: _fivetran_synced
            description: '{{ doc("_fivetran_synced") }}'

      - name: campaign_bid_modifier_history
        description: Each record represents a historical version of a campaign bid modifier in Google Ads.
        identifier: "{{ var('google_ads_campaign_bid_modifier_history_identifier', 'campaign_bid_modifier_history') }}"
        config:
          enabled: "{{ var('ad_reporting__google_ads_enabled', true) and var('google_ads__using_campaign_bid_modifier_history', true) and var('google_ads_sources', []) == [] }}"
        columns:
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: criterion_id
            description: Unique identifier of the criterion that the bid modifier is applied to.
          - name: bid_modifier
            description: The modifier applied to the bid for this criterion.
          - name: interaction_type
            description: The type of interaction for the bid modifier.
          - name: interaction_event_types
            description: The event types for the interaction.
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: campaign_budget_history
        description: Each record represents a historical version of a campaign budget in Google Ads.
        identifier: "{{ var('google_ads_campaign_budget_history_identifier', 'campaign_budget_history') }}"
        config:
          enabled: "{{ var('ad_reporting__google_ads_enabled', true) and var('google_ads__using_campaign_budget_history', true) and var('google_ads_sources', []) == [] }}"
        columns:
          - name: id
            description: Unique identifier of the budget.
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: amount_micros
            description: The daily budget amount in micros.
          - name: delivery_method
            description: The delivery method for the budget (STANDARD or ACCELERATED).
          - name: explicitly_shared
            description: Boolean indicating if the budget is explicitly shared across campaigns.
          - name: name
            description: The name of the budget.
          - name: reference_count
            description: The number of campaigns using this budget.
          - name: status
            description: The status of the budget.
          - name: has_recommended_budget
            description: Boolean indicating if Google has a recommended budget for this campaign.
          - name: period
            description: The budget period (e.g., DAILY, LIFETIME).
          - name: recommended_budget_amount_micros
            description: Google's recommended daily budget amount in micros.
          - name: total_amount_micros
            description: The total budget amount in micros for lifetime budgets.
          - name: type
            description: The type of budget (DAILY, LIFETIME, etc.).
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: campaign_criterion_history
        description: Each record represents a historical version of a campaign criterion in Google Ads.
        identifier: "{{ var('google_ads_campaign_criterion_history_identifier', 'campaign_criterion_history') }}"
        config:
          enabled: "{{ var('ad_reporting__google_ads_enabled', true) and var('google_ads__using_campaign_criterion_history', true) and var('google_ads_sources', []) == [] }}"
        columns:
          - name: id
            description: Unique identifier of the campaign criterion.
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: geo_target_constant_id
            description: The geographic target constant ID for location targeting.
          - name: mobile_device_id
            description: The mobile device constant ID for mobile device targeting.
          - name: operating_system_version_id
            description: The operating system version constant ID for OS targeting.
          - name: topic_constant_id
            description: The topic constant ID for topic targeting.
          - name: user_interest_id
            description: The user interest constant ID for interest targeting.
          - name: user_list_id
            description: The user list ID for audience targeting.
          - name: age_range_type
            description: The age range type for demographic targeting.
          - name: bid_modifier
            description: The bid modifier applied to this criterion.
          - name: carrier_country_code
            description: The country code for carrier targeting.
          - name: carrier_name
            description: The carrier name for carrier targeting.
          - name: content_label_type
            description: The content label type for content exclusion.
          - name: device_type
            description: The device type for targeting (MOBILE, DESKTOP, TABLET).
          - name: display_name
            description: The display name of the criterion.
          - name: gender_type
            description: The gender type for demographic targeting.
          - name: income_range_type
            description: The income range type for demographic targeting.
          - name: ip_block_ip_address
            description: The IP address for IP block targeting.
          - name: negative
            description: Boolean indicating if this is a negative criterion (exclusion).
          - name: keyword_match_type
            description: The match type for keyword targeting.
          - name: keyword_text
            description: The keyword text for keyword targeting.
          - name: language_code
            description: The language code for language targeting.
          - name: language_name
            description: The language name for language targeting.
          - name: mobile_app_category_constant_id
            description: The mobile app category constant ID for app category targeting.
          - name: mobile_app_category_constant_name
            description: The mobile app category name for app category targeting.
          - name: mobile_application_app_id
            description: The mobile application app ID for app targeting.
          - name: mobile_application_name
            description: The mobile application name for app targeting.
          - name: parental_status_type
            description: The parental status type for demographic targeting.
          - name: placement_url
            description: The placement URL for placement targeting.
          - name: status
            description: The status of the criterion.
          - name: type
            description: The type of criterion (e.g., KEYWORD, PLACEMENT, AUDIENCE).
          - name: youtube_channel_id
            description: The YouTube channel ID for YouTube channel targeting.
          - name: youtube_video_id
            description: The YouTube video ID for YouTube video targeting.
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.

      - name: campaign_bidding_strategy_history
        description: Each record represents a historical version of a campaign bidding strategy in Google Ads.
        identifier: "{{ var('google_ads_campaign_bidding_strategy_history_identifier', 'campaign_bidding_strategy_history') }}"
        config:
          enabled: "{{ var('ad_reporting__google_ads_enabled', true) and var('google_ads__using_campaign_bidding_strategy_history', true) and var('google_ads_sources', []) == [] }}"
        columns:
          - name: campaign_id
            description: "{{ doc('campaign_id') }}"
          - name: updated_at
            description: "{{ doc('updated_at') }}"
          - name: cpc_bid_ceiling_micros
            description: The maximum cost per click bid in micros.
          - name: cpc_bid_floor_micros
            description: The minimum cost per click bid in micros.
          - name: enhanced_cpc
            description: Boolean indicating if enhanced CPC is enabled.
          - name: enhanced_cpc_enabled
            description: Boolean indicating if enhanced CPC is enabled (alternative field).
          - name: location
            description: The location for location-based bidding strategies.
          - name: location_fraction_micros
            description: The location fraction for location-based strategies in micros.
          - name: manual_cpa
            description: Manual cost per acquisition setting.
          - name: manual_cpm
            description: Manual cost per mille setting.
          - name: manual_cpv
            description: Manual cost per view setting.
          - name: name
            description: The name of the bidding strategy.
          - name: status
            description: The status of the bidding strategy.
          - name: target_cpa_micros
            description: Target cost per acquisition in micros.
          - name: target_cpm
            description: Target cost per mille.
          - name: target_roas
            description: Target return on ad spend.
          - name: type
            description: The type of bidding strategy (MANUAL_CPC, TARGET_CPA, etc.).
          - name: _fivetran_active
            description: Boolean representing whether the state of the record is currently active.
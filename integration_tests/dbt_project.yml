name: 'google_ads_integration_tests'
version: '1.4.1'

profile: 'integration_tests'
config-version: 2

vars:
  google_ads:
    google_ads_schema: google_ads_integration_tests
    google_ads_ad_stats_identifier: "ad_stats_data"
    google_ads_ad_history_identifier: "ad_history_data"
    google_ads_ad_group_history_identifier: "ad_group_history_data"
    google_ads_campaign_history_identifier: "campaign_history_data"
    google_ads_account_history_identifier: "account_history_data"
    google_ads_keyword_stats_identifier: "keyword_stats_data"
    google_ads_account_stats_identifier: "account_stats_data"
    google_ads_ad_group_stats_identifier: "ad_group_stats_data"
    google_ads_campaign_stats_identifier: "campaign_stats_data"
    google_ads_ad_group_criterion_history_identifier: "ad_group_criterion_history_data"
    google_ads_search_term_keyword_stats_identifier: "search_term_keyword_stats_data"
    google_ads_campaign_bid_modifier_history_identifier: "campaign_bid_modifier_history_data"
    google_ads_campaign_budget_history_identifier: "campaign_budget_history_data"
    google_ads_campaign_criterion_history_identifier: "campaign_criterion_history_data"
    google_ads_campaign_bidding_strategy_history_identifier: "campaign_bidding_strategy_history_data"

# Comment out for docs generation
  google_ads__campaign_stats_passthrough_metrics:
    - name: conversions # @docs-ignore
    - name: view_through_conversions # @docs-ignore
      alias: view_through_conversions_aliased # @docs-ignore

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  +schema: "google_ads_{{ var('directed_schema','dev') }}"

seeds:
  +docs:
    show: false
  +quote_columns: "{{ target.type == 'redshift' or var('fivetran_using_source_casing', false) }}"
  google_ads_integration_tests:
    account_history_data:
      +column_types:
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    account_stats_data:
      +column_types:
        customer_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    ad_group_criterion_history_data:
      +column_types:
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        ad_group_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        base_campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    ad_group_history_data:
      +column_types:
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    ad_group_stats_data:
      +column_types:
        customer_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    ad_history_data:
      +column_types:
        ad_group_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    ad_stats_data:
      +column_types:
        customer_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        ad_group_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        ad_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    campaign_bid_modifier_history_data:
      +column_types:
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        criterion_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    campaign_budget_history_data:
      +column_types:
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    campaign_criterion_history_data:
      +column_types:
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        geo_target_constant_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        mobile_device_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        operating_system_version_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        topic_constant_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        user_interest_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        user_list_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        mobile_app_category_constant_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    campaign_bidding_strategy_history_data:
      +column_types:
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    campaign_history_data:
      +column_types:
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        customer_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    campaign_stats_data:
      +column_types:
        customer_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    keyword_stats_data:
      +column_types:
        customer_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        ad_group_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        ad_group_criterion_criterion_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
    search_term_keyword_stats_data:
      +column_types:
        ad_group_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        campaign_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"
        customer_id: "{{ 'INT64' if target.type == 'bigquery' else 'bigint' }}"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

flags:
  send_anonymous_usage_stats: False
  use_colors: True
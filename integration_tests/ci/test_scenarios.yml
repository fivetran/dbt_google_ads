schema_variable_name: "google_ads_schema"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "url report null filter disabled"
    vars:
      ad_reporting__url_report__using_null_filter: false
      google_ads__using_search_term_keyword_stats: false
      google_ads__using_campaign_bid_modifier_history: false
      google_ads__using_campaign_budget_history: false
    include_incremental: false

  - name: "bidding strategy history disabled"
    vars:
      google_ads__using_campaign_bidding_strategy_history: false
      google_ads__using_campaign_criterion_history: false
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true

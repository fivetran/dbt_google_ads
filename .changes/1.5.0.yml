version: 1.5.0
pr_number: 109
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- description: Adds documentation for two columns the package already outputs. This
    change is documentation only and does not affect your data.
  details:
  - '`ad_name` in the `google_ads__ad_report` and `stg_google_ads__ad_history` models.'
  - '`final_urls` in the `stg_google_ads__ad_history` model.'
